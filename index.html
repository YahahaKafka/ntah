<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little something</title>
<style>
:root{--bg:#060a1c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;max-width:100%}
</style>
</head>
<body>
<canvas id="c" aria-label="ASCII art bouquet of flowers held by a cat"></canvas>
<script>
const COLS = 64, ROWS = 52;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let cw, chh, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  cw = Math.min(innerWidth / COLS, innerHeight / (ROWS * 2));
  chh = cw * 2;
  cv.width = COLS * cw * dpr; cv.height = ROWS * chh * dpr;
  cv.style.width = COLS * cw + 'px'; cv.style.height = ROWS * chh + 'px';
}
resize(); addEventListener('resize', resize);

// flowers: x, y, radius, petals, hue, delay
const flowers = [
  {x:32,y:8,r:5,p:5,h:200,d:0.2},{x:18,y:14,r:5,p:6,h:330,d:0.6},{x:46,y:14,r:5,p:5,h:210,d:0.8},
  {x:32,y:19,r:6,p:7,h:340,d:1.0},{x:12,y:24,r:4,p:5,h:50,d:1.3},{x:52,y:24,r:4,p:6,h:35,d:1.5},
  {x:24,y:27,r:4,p:4,h:15,d:1.7},{x:41,y:27,r:4,p:5,h:280,d:1.8},
  {x:7,y:16,r:3,p:3,h:130,d:0.4},{x:57,y:17,r:3,p:3,h:140,d:0.6},{x:32,y:27,r:3,p:3,h:125,d:0.5}
];
const ramp = ['.', ':', '-', '=', '+', '*', '#', '%', '@'];
const particles = Array.from({length: 46}, () => ({
  x: Math.random() * COLS, y: Math.random() * ROWS, v: 0.4 + Math.random() * 1.2,
  ch: ['<3', '*', 'x', 'o', '.', '+', '<3'][Math.floor(Math.random() * 7)],
  h: [320, 50, 200, 280, 10][Math.floor(Math.random() * 5)], ph: Math.random() * 6.28
}));
const caption = 'A little something';
let t0 = performance.now();
cv.addEventListener('click', () => t0 = performance.now());

let grid;
function set(x, y, ch, col) {
  x = Math.round(x); y = Math.round(y);
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
  grid[y * COLS + x] = [ch, col];
}
function text(x, y, s, col) { for (let i = 0; i < s.length; i++) if (s[i] !== ' ') set(x + i, y, s[i], col); }

function frame(now) {
  const t = (now - t0) / 1000;
  grid = new Array(COLS * ROWS).fill(null);

  // drifting particles
  for (const p of particles) {
    const y = ((p.y - t * p.v) % ROWS + ROWS) % ROWS;
    const x = p.x + Math.sin(t + p.ph) * 1.5;
    if (Math.sin(t * 2 + p.ph) > -0.4) text(Math.round(x), Math.round(y), p.ch, `hsl(${p.h},90%,70%)`);
  }

  // stems + wrap
  const sw = Math.sin(t * 1.2) * 0.8;
  for (const f of flowers) {
    const g = Math.min(1, Math.max(0, (t - f.d) / 1.4));
    if (g <= 0) continue;
    const sx = 32 + (f.x - 32) * 0.1, sy = 32;
    const n = 26;
    for (let i = 0; i <= n * g; i++) {
      const k = i / n;
      const x = f.x + (sx - f.x) * k + Math.sin(k * 3 + t) * 0.3 * (1 - k);
      const y = f.y + f.r * 0.7 + (sy - f.y - f.r * 0.7) * k;
      if (y < 33) set(x, y, k < .5 ? '|' : ':', `hsl(125,60%,${40 + k * 15}%)`);
    }
  }
  const wrapG = Math.min(1, t / 1.2);
  for (let y = 31; y < 31 + 11 * wrapG; y++) {
    const half = 11 - (y - 31) * 0.9;
    for (let x = -half; x <= half; x++) {
      const edge = Math.abs(x) > half - 1;
      const ch = edge ? '#' : ((x + y) % 2 ? '-' : '=');
      set(32 + x, y, ch, `hsl(${28 + (y - 31) * 1.5},85%,${62 - (y - 31)}%)`);
    }
  }

  // flowers
  for (const f of flowers) {
    const g = Math.min(1, Math.max(0, (t - f.d) / 1.4));
    if (g <= 0) continue;
    const e = 1 - Math.pow(1 - g, 3);
    const R = f.r * e, rot = t * 0.3 + f.x;
    const ox = Math.sin(t * 1.1 + f.x) * 0.6 + sw * (1 - f.y / 30) * 0.5;
    const oy = Math.cos(t * 0.9 + f.y) * 0.3;
    for (let dy = -R; dy <= R; dy++) for (let dx = -R * 2; dx <= R * 2; dx++) {
      const nx = dx / 2, d = Math.hypot(nx, dy);
      const ang = Math.atan2(dy, nx) + rot;
      const petal = (0.7 + 0.3 * Math.cos(f.p * ang)) * R;
      if (d > petal) continue;
      let ch, col;
      if (d < R * 0.22 && f.h > 100 === false || d < R * 0.22 && f.h < 100) { ch = '@'; col = `hsl(${40 + (Math.sin(t * 3 + dx) * 8)},100%,60%)`; }
      else if (d < R * 0.22) { ch = 'o'; col = 'hsl(48,100%,65%)'; }
      else {
        const v = 1 - d / petal;
        ch = ramp[Math.min(8, Math.floor((1 - v) * 4 + (d / R) * 3 + 1))];
        col = `hsl(${f.h},80%,${52 + v * 25}%)`;
      }
      set(f.x + dx + ox, f.y + dy + oy, ch, col);
    }
  }

  // cat holding the bouquet
  const bob = Math.round(Math.sin(t * 2) * 0.5);
  const cy = 41 + bob;
  const body = '#e8c4a0', dark = '#b98a62';
  text(25, cy,     '  /|       |\\  ', dark);
  text(25, cy + 1, ' / |_______| \\ ', body);
  text(25, cy + 2, '(  ( o) (o )  )', '#ffe066');
  text(25, cy + 3, ' \\  \\WWWWW/  / ', '#ffffff');
  text(25, cy + 4, '  \\_________/  ', body);
  text(25, cy + 5, '    /|   |\\    ', dark);
  text(25, cy + 6, '   (_)   (_)   ', dark);
  text(31, cy + 2, '<3', '#ff7ab6');
  // sparkle ring
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * 6.28 + t;
    set(32 + Math.cos(a) * 12, 44 + bob + Math.sin(a) * 4.5, i % 2 ? '.' : '\u00b7', 'hsl(200,70%,70%)');
  }

  // typewriter caption
  const n = Math.max(0, Math.min(caption.length, Math.floor((t - 3.5) * 8)));
  if (n > 0) text(32 - Math.floor(caption.length / 2), 50, caption.slice(0, n), 'hsl(195,90%,72%)');

  // draw
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#060a1c'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.font = `bold ${cw * 1.6}px "Courier New", monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < grid.length; i++) {
    const c = grid[i]; if (!c) continue;
    ctx.fillStyle = c[1];
    ctx.fillText(c[0], (i % COLS + 0.5) * cw, (Math.floor(i / COLS) + 0.5) * chh);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
